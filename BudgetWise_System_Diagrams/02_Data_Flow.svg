<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#52665b"/></marker></defs><rect width="1200" height="850" fill="white"/><text x="45" y="55" font-family="Arial" font-size="32" fill="#203b30">BudgetWise: level-1 logical data flow</text><rect x="40" y="150" width="230" height="90" rx="10" fill="#f3f6ef" stroke="#6d8474" stroke-width="2"/><text x="55" y="202" font-family="Arial" font-size="23" fill="#203b30">User input</text><rect x="370" y="150" width="340" height="90" rx="10" fill="#f3f6ef" stroke="#6d8474" stroke-width="2"/><text x="385" y="202" font-family="Arial" font-size="23" fill="#203b30">1. Validate and update</text><rect x="850" y="150" width="300" height="90" rx="10" fill="#f3f6ef" stroke="#6d8474" stroke-width="2"/><text x="865" y="202" font-family="Arial" font-size="23" fill="#203b30">2. Calculate summaries</text><rect x="370" y="350" width="340" height="90" rx="10" fill="#f3f6ef" stroke="#6d8474" stroke-width="2"/><text x="385" y="402" font-family="Arial" font-size="23" fill="#203b30">Transaction state</text><rect x="850" y="350" width="300" height="90" rx="10" fill="#f3f6ef" stroke="#6d8474" stroke-width="2"/><text x="865" y="402" font-family="Arial" font-size="23" fill="#203b30">3. Render screens</text><rect x="370" y="580" width="340" height="100" rx="10" fill="#f3f6ef" stroke="#6d8474" stroke-width="2"/><text x="385" y="632" font-family="Arial" font-size="23" fill="#203b30">D1 localStorage</text><rect x="40" y="580" width="230" height="100" rx="10" fill="#f3f6ef" stroke="#6d8474" stroke-width="2"/><text x="55" y="632" font-family="Arial" font-size="23" fill="#203b30">Backup JSON</text><path d="M270 195 L365 195" stroke="#52665b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="175" font-family="Arial" font-size="17" fill="#203b30">entry</text><path d="M540 240 L540 345" stroke="#52665b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="300" font-family="Arial" font-size="17" fill="#203b30">valid records</text><path d="M710 395 L810 395" stroke="#52665b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M810 395 L810 195" stroke="#52665b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M810 195 L845 195" stroke="#52665b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="727" y="300" font-family="Arial" font-size="17" fill="#203b30">state</text><path d="M1000 240 L1000 345" stroke="#52665b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="1010" y="300" font-family="Arial" font-size="17" fill="#203b30">totals</text><path d="M540 440 L540 575" stroke="#52665b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="520" font-family="Arial" font-size="17" fill="#203b30">save JSON</text><path d="M650 580 L650 445" stroke="#52665b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="665" y="515" font-family="Arial" font-size="17" fill="#203b30">reload</text><path d="M270 630 L310 630 L310 195 L365 195" stroke="#52665b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M370 395 L155 395 L155 575" stroke="#52665b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="480" font-family="Arial" font-size="17" fill="#203b30">export</text><text x="275" y="535" font-family="Arial" font-size="17" fill="#203b30">import</text><text x="90" y="735" font-family="Arial" font-size="20" fill="#203b30">Import: validate before replacing state. Export: serialise valid state.</text><text x="90" y="780" font-family="Arial" font-size="20" fill="#203b30">All processing is browser-local. No backend database or bank API.</text></svg>